# Written by senior-mode setup (ci.mode "actions"). Runs the checks of .claude/senior-mode.json,
# the same list as the pre-push hook and `senior-mode check`, and sets the senior-mode/ci status.
name: senior-mode

on:
  pull_request:
  # A branch filter cannot name the default branch; each job checks it instead, so a renamed
  # default branch keeps working and other pushes spend nothing (skipped jobs use no minutes).
  push:

permissions:
  contents: read
  statuses: write

concurrency:
  group: senior-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Default branch
        # checkout leaves origin/HEAD unset; the commit subjects check compares against it.
        run: git remote set-head origin "${{ github.event.repository.default_branch }}"
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lock', 'bun.lockb') != ''
      - uses: actions/cache@v4
        if: hashFiles('package.json') != ''
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            ~/.local/share/pnpm/store
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          # Node 25 and later ship without corepack, which provides pnpm and yarn.
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then npm install --global corepack && corepack enable; fi
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Checks
        run: |
          count=$(jq -e '.checks | length' .claude/senior-mode.json) && [ "$count" -gt 0 ] ||
            { echo "FAILED=no checks in .claude/senior-mode.json" >>"$GITHUB_ENV"; exit 1; }
          failed="" passed=0
          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".checks[$i].name" .claude/senior-mode.json)
            run=$(jq -r ".checks[$i].run" .claude/senior-mode.json)
            echo "::group::$name"
            if bash -c "$run" </dev/null; then passed=$((passed + 1)); else failed="$failed${failed:+, }$name"; fi
            echo "::endgroup::"
          done
          echo "PASSED=$passed/$count checks passed" >>"$GITHUB_ENV"
          echo "FAILED=$failed" >>"$GITHUB_ENV"
          [ -z "$failed" ] || { echo "failed: $failed"; exit 1; }
      - name: Status senior-mode/ci
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ job.status }}" = success ]; then state=success desc=$PASSED
          else state=failure desc="failed: ${FAILED:-setup}"
          fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" \
            -f context=senior-mode/ci -f description="${desc:0:140}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Private repositories need GitHub Advanced Security for it: a refusal is not a failure.
    continue-on-error: true
    steps:
      - uses: actions/dependency-review-action@v4
