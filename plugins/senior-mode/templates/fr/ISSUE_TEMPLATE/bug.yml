name: Bug
description: Quelque chose ne marche pas comme prévu
labels: ["type:bug"]
body:
  - type: textarea
    id: happens
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Étapes numérotées, et où (page, commande, version).
    validations:
      required: true
